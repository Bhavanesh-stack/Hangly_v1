             C 84 76, 88 92, 88 112
             C 88 135, 78 149, 64 156
             C 50 162, 34 161, 20 156
             C 10 152, 5 142, 5 132
             C 5 120, 11 110, 19 104
             C 27 98, 36 96, 43 90
             C 49 84, 52 75, 49 68
             C 47 63, 44 61, 40 64
             C 36 67, 33 73, 29 79
             C 25 86, 21 91, 15 91
             C 11 91, 8 86, 11 81
             C 15 74, 23 66, 31 59
             C 38 52, 44 48, 47 48 Z"
          fill="url(#prussianDeep)"/>

    <!-- 2. INNER CAVITY / HOLLOW OF THE GREAT WAVE (Dark midnight depth under the crest) -->
    <path d="M 76 78
             C 74 94, 66 112, 53 124
             C 42 133, 29 135, 18 131
             C 14 129, 13 123, 16 119
             C 21 114, 29 110, 36 104
             C 44 98, 49 88, 48 78
             C 47 70, 42 66, 38 68
             C 45 61, 55 58, 63 62
             C 71 67, 76 72, 76 78 Z"
