  <g id="flankDiamonds">
    <circle cx="23.2" cy="94.5" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="20.5" cy="97.2" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="24.8" cy="98.5" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

