<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 165" width="94" height="165">
  <defs>
    <!-- Silk Cord & Bead Gradients -->
    <linearGradient id="silkCord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#2a4365"/>
      <stop offset="100%" stop-color="#071326"/>
    </linearGradient>

    <radialGradient id="goldBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>

    <radialGradient id="indigoBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="75%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Authentic Hokusai Prussian Blue Gradients -->
    <linearGradient id="prussianDeep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="45%" stop-color="#102a54"/>
      <stop offset="85%" stop-color="#18417c"/>
      <stop offset="100%" stop-color="#0b1b36"/>
    </linearGradient>

    <linearGradient id="prussianMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143668"/>
      <stop offset="40%" stop-color="#1d5096"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="waveHollow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="60%" stop-color="#0c2346"/>
      <stop offset="100%" stop-color="#16386b"/>
    </linearGradient>

    <linearGradient id="foamShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="85%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for the entire Wave Talisman -->
    <filter id="waveShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.0" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- ================= TOP SUSPENSION CORD & KUMIHIMO BEADS ================= -->
  <!-- Hanging Cord (y: 0 to 48) -->
  <line x1="47" y1="0" x2="47" y2="48" stroke="url(#silkCord)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Bead 1: Polished Brass / Gold Ring Bead (y: 11 - 18) -->
  <circle cx="47" cy="14.5" r="5.6" fill="url(#goldBead)"/>
  <ellipse cx="45.5" cy="12.8" rx="2.0" ry="1.2" fill="#ffffff" opacity="0.85"/>

  <!-- Bead 2: Indigo Ceramic Ocean Bead (y: 23 - 36) -->
  <circle cx="47" cy="29.5" r="6.8" fill="url(#indigoBead)"/>
  <ellipse cx="44.8" cy="27.0" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Gold wave line on the ceramic bead -->
  <path d="M 42 30 Q 47 28 52 30" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.8"/>

  <!-- Attachment Loop / Knot Ring (y: 40 - 48) -->
  <circle cx="47" cy="44.5" r="4.2" fill="none" stroke="url(#goldBead)" stroke-width="2.2"/>
  <circle cx="47" cy="44.5" r="2.0" fill="#081528"/>

