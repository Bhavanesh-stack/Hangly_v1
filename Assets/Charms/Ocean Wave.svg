    <circle cx="51.2" cy="109.2" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="54.2" cy="111.0" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <circle cx="43.2" cy="113.2" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
