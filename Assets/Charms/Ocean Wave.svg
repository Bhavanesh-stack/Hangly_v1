  <!-- 8. BRILLIANT DIAMOND STARBURST SPARKLE ACCENTS -->
  <!-- 4-point Diamond Star Glints -->
  <g id="sparkleGlints" fill="#ffffff" opacity="0.95">
    <!-- Starburst on top crest -->
