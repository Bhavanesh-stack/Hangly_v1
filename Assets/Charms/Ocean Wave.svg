             C 71 87, 72 90, 70 92
             C 68 94, 65 91, 63 93
             C 61 95, 62 98, 60 100
             C 58 102, 55 98, 52 101
             C 49 104, 51 108, 48 111
             C 45 114, 42 110, 39 113
             C 36 116, 38 120, 35 123
