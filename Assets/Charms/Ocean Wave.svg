    <circle cx="46.8" cy="70.0" r="0.4" fill="#ffffff"/>

    <circle cx="50.2" cy="73.0" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="49.8" cy="72.5" r="0.4" fill="#ffffff"/>

    <circle cx="51.8" cy="76.8" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="49.5" cy="80.5" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="46.2" cy="81.8" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <!-- Inside Pave Bed Diamonds -->
    <circle cx="41.5" cy="74.5" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="45.0" cy="75.2" r="1.5" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="48.0" cy="76.5" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <circle cx="37.8" cy="77.5" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="41.2" cy="78.8" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="44.5" cy="79.5" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <circle cx="35.5" cy="82.0" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="38.8" cy="83.2" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="42.0" cy="84.2" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <circle cx="33.5" cy="86.8" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="36.8" cy="87.8" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="40.0" cy="88.8" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <!-- Foam Tip Droplets / Diamonds -->
    <circle cx="43.2" cy="92.2" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="46.5" cy="91.5" r="1.0" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="49.2" cy="92.8" r="0.9" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.25"/>
    <circle cx="38.2" cy="93.8" r="1.0" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.25"/>
  </g>

  <!-- SECONDARY WAVE DIAMOND CLUSTER -->
  <g id="secondaryDiamonds">
    <circle cx="49.5" cy="103.5" r="1.5" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
