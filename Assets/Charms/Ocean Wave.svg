<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 165" width="92" height="165">
  <defs>
    <!-- Cord and Bead Gradients -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7d591b"/>
      <stop offset="50%" stop-color="#c99f4a"/>
      <stop offset="100%" stop-color="#604210"/>
    </linearGradient>

    <radialGradient id="pearlGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f4f8"/>
      <stop offset="80%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </radialGradient>

    <radialGradient id="aquaGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0fbfc"/>
      <stop offset="35%" stop-color="#48cae4"/>
      <stop offset="75%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </radialGradient>

    <radialGradient id="lapisGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="30%" stop-color="#0077b6"/>
      <stop offset="70%" stop-color="#03045e"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </radialGradient>

    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Medallion Rim Gradients -->
    <radialGradient id="rimGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="95%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf0d5"/>
      <stop offset="35%" stop-color="#f7d6a5"/>
      <stop offset="65%" stop-color="#c6dcdd"/>
      <stop offset="100%" stop-color="#729baf"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="deepWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="50%" stop-color="#023e8a"/>
      <stop offset="100%" stop-color="#0466c8"/>
    </linearGradient>

    <linearGradient id="midWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="60%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>

    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0096c7"/>
      <stop offset="50%" stop-color="#caf0f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Clip Path for Medallion Content -->
    <clipPath id="medallionClip">
      <circle cx="46" cy="105" r="38"/>
    </clipPath>
  </defs>

  <!-- ================= TOP SUSPENSION CORD & THREADED BEADS ================= -->
  <!-- Main Hanging Cord -->
  <line x1="46" y1="0" x2="46" y2="48" stroke="url(#cordGrad)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Bead 1: Pearl with Gold Caps -->
  <path d="M 42 7 Q 46 9 50 7 L 49.5 6 Q 46 8 42.5 6 Z" fill="url(#goldCapGrad)"/>
  <circle cx="46" cy="12" r="6.8" fill="url(#pearlGrad)"/>
  <ellipse cx="44" cy="9.8" rx="2.5" ry="1.4" fill="#ffffff" opacity="0.85"/>
  <path d="M 42 17 Q 46 15 50 17 L 49.5 18 Q 46 16 42.5 18 Z" fill="url(#goldCapGrad)"/>

  <!-- Bead 2: Aquamarine Jewel Bead -->
  <path d="M 41.5 19 Q 46 21 50.5 19 L 50 18 Q 46 20 42 18 Z" fill="url(#goldCapGrad)"/>
  <circle cx="46" cy="24" r="7.2" fill="url(#aquaGrad)"/>
  <ellipse cx="43.8" cy="21.5" rx="2.8" ry="1.6" fill="#ffffff" opacity="0.8"/>
  <circle cx="48.5" cy="25.5" r="1.1" fill="#e0fbfc" opacity="0.9"/>
  <path d="M 41.5 29 Q 46 27 50.5 29 L 50 30 Q 46 28 42 30 Z" fill="url(#goldCapGrad)"/>

  <!-- Bead 3: Lapis Lazuli Ocean Bead -->
  <path d="M 41 31 Q 46 33 51 31 L 50.5 30 Q 46 32 41.5 30 Z" fill="url(#goldCapGrad)"/>
  <circle cx="46" cy="36" r="7.5" fill="url(#lapisGrad)"/>
  <ellipse cx="43.6" cy="33.2" rx="3.0" ry="1.7" fill="#ffffff" opacity="0.75"/>
  <!-- Gold Fleck Accents in Lapis -->
  <circle cx="48" cy="37" r="0.8" fill="#ffd166" opacity="0.85"/>
  <circle cx="44" cy="38.5" r="0.6" fill="#ffd166" opacity="0.75"/>
  <path d="M 41 41 Q 46 39 51 41 L 50.5 42 Q 46 40 41.5 42 Z" fill="url(#goldCapGrad)"/>

  <!-- Attachment Knot Ring -->
  <circle cx="46" cy="46" r="4.8" fill="none" stroke="url(#goldCapGrad)" stroke-width="2.6"/>
  <circle cx="46" cy="46" r="2.2" fill="#1e1403"/>

  <!-- ================= THE GREAT WAVE TALISMAN / MEDALLION ================= -->
  <!-- Outer Shadow & Base Rim -->
  <circle cx="46" cy="105.5" r="41" fill="#1a1205" opacity="0.35"/>
  <circle cx="46" cy="105" r="40.5" fill="url(#rimGrad)"/>
  <circle cx="46" cy="105" r="38.5" fill="#422006"/>
  <circle cx="46" cy="105" r="38" fill="url(#skyGrad)"/>

  <!-- Inner Clipped Artwork -->
  <g clip-path="url(#medallionClip)">
    <!-- Horizon Golden Glow -->
    <ellipse cx="46" cy="98" rx="38" ry="18" fill="#ffe3a8" opacity="0.45"/>

    <!-- Mt. Fuji in distance -->
    <path d="M 50 99 L 57 88 L 60 88 L 68 99 Z" fill="#1b2a47"/>
    <path d="M 57 88 L 60 88 L 62 92 L 60 93 L 58.5 91.5 L 57 93 Z" fill="#ffffff"/>

    <!-- Distant Sea Surface -->
    <rect x="8" y="99" width="76" height="45" fill="#042a54"/>

    <!-- Distant Low Waves -->
    <path d="M 8 103 Q 22 98 36 102 T 64 100 T 84 103 L 84 145 L 8 145 Z" fill="#0a3a6b"/>
    <path d="M 8 107 Q 24 102 40 106 T 70 104 T 84 107 L 84 145 L 8 145 Z" fill="#0d4b82"/>

    <!-- Secondary Wave (Counter-Wave on Right) -->
    <path d="M 84 122 C 72 118 64 115 54 118 C 46 120 40 128 35 138 L 84 145 Z" fill="url(#deepWaveGrad)"/>
    <path d="M 84 124 C 74 120 66 117 56 120 C 49 122 43 129 38 138 L 84 145 Z" fill="url(#midWaveGrad)"/>
    <!-- Foam on Secondary Wave -->
    <path d="M 54 117 C 58 116 64 118 70 120 C 76 122 81 123 84 123 L 84 126 C 80 125 75 124 69 122 C 63 120 57 119 54 120 Z" fill="#ffffff"/>

    <!-- THE GREAT CRESTING WAVE (Main Body) -->
    <!-- Base Wave Body -->
    <path d="M 8 145 C 8 126 12 110 18 96 C 22 87 27 79 34 74 C 40 70 48 68 53 71 C 57 73 59 78 57 83 C 55 87 50 89 44 88 C 37 87 32 82 29 88 C 26 94 28 104 26 112 C 24 121 18 135 8 145 Z" fill="url(#deepWaveGrad)"/>

    <!-- Inner Mid-Wave Curve -->
    <path d="M 8 145 C 10 130 14 117 20 104 C 24 96 29 89 36 84 C 42 80 49 79 53 82 C 55 84 56 87 54 90 C 51 93 46 94 41 93 C 35 91 30 92 28 98 C 26 104 27 114 24 122 C 20 131 15 140 8 145 Z" fill="url(#midWaveGrad)"/>

    <!-- High Crest Foaming Claws & Spray Layer -->
    <!-- Wave Claw 1 (Topmost Curl) -->
    <path d="M 33 76 C 38 71 46 68 53 70 C 58 72 61 77 59 82 C 57 85 53 86 49 84 C 45 82 43 78 40 80 C 37 82 36 86 38 89 C 39 91 43 92 46 91 C 49 90 51 86 54 86 C 56 86 58 88 57 91 C 55 95 49 96 44 95 C 38 94 33 89 30 84 C 27 79 30 78 33 76 Z" fill="url(#crestGrad)"/>

    <!-- Distinctive White Wave Claws (Hokusai Fingers) -->
    <!-- Finger 1 -->
    <path d="M 52 70 C 56 70 60 74 58 78 C 57 80 54 80 53 78 C 52 75 50 73 47 74 C 45 74 44 73 45 71 C 47 69 50 70 52 70 Z" fill="#ffffff"/>
    <!-- Finger 2 -->
    <path d="M 58 77 C 62 79 63 84 60 87 C 59 88 56 87 56 85 C 56 83 58 81 56 80 C 54 79 55 77 58 77 Z" fill="#ffffff"/>
    <!-- Finger 3 -->
    <path d="M 55 83 C 58 85 58 89 55 91 C 53 92 51 90 52 88 C 53 86 54 85 52 84 C 51 83 52 82 55 83 Z" fill="#ffffff"/>
    <!-- Finger 4 (Back curl) -->
    <path d="M 43 73 C 45 68 50 67 52 69 C 50 71 47 72 45 75 Z" fill="#ffffff"/>
    <!-- Finger 5 (Forward plunge) -->
    <path d="M 48 83 C 51 82 54 84 53 86 C 50 87 47 86 46 84 Z" fill="#ffffff"/>

    <!-- Wave Swirl Lines (Traditional Japanese Ukiyo-e Striae) -->
    <path d="M 12 142 C 16 125 21 112 26 100 C 30 92 35 86 42 83" fill="none" stroke="#caf0f8" stroke-width="1.2" opacity="0.85"/>
    <path d="M 15 145 C 19 130 24 118 29 107 C 33 100 37 94 43 92" fill="none" stroke="#caf0f8" stroke-width="1.0" opacity="0.75"/>
    <path d="M 19 145 C 23 135 27 125 32 116 C 36 109 40 104 46 102" fill="none" stroke="#90e0ef" stroke-width="0.8" opacity="0.7"/>

    <!-- White Sea Spray / Droplet Particles -->
    <circle cx="56" cy="67" r="1.3" fill="#ffffff"/>
    <circle cx="61" cy="71" r="1.1" fill="#ffffff"/>
    <circle cx="64" cy="76" r="0.9" fill="#ffffff"/>
    <circle cx="66" cy="82" r="1.2" fill="#ffffff"/>
    <circle cx="63" cy="86" r="0.8" fill="#ffffff"/>
    <circle cx="60" cy="92" r="1.0" fill="#ffffff"/>

    <circle cx="49" cy="65" r="0.9" fill="#ffffff"/>
    <circle cx="43" cy="67" r="1.1" fill="#ffffff"/>
    <circle cx="37" cy="70" r="0.8" fill="#ffffff"/>
    <circle cx="53" cy="63" r="0.7" fill="#ffffff"/>

    <circle cx="38" cy="94" r="1.0" fill="#ffffff" opacity="0.9"/>
    <circle cx="33" cy="98" r="0.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="35" cy="103" r="1.1" fill="#ffffff" opacity="0.9"/>

    <circle cx="68" cy="116" r="0.8" fill="#ffffff"/>
    <circle cx="73" cy="118" r="1.0" fill="#ffffff"/>
    <circle cx="61" cy="114" r="0.9" fill="#ffffff"/>

    <!-- Deep Water Bottom Rim -->
    <path d="M 8 138 Q 46 142 84 138 L 84 145 L 8 145 Z" fill="#001233"/>
  </g>

  <!-- Inner Bezel Ring Highlight -->
  <circle cx="46" cy="105" r="38" fill="none" stroke="url(#goldCapGrad)" stroke-width="1.8" opacity="0.9"/>
  <circle cx="46" cy="105" r="39.6" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.6"/>

  <!-- ================= BOTTOM PENDANT / TALISMAN ACCENT ================= -->
  <!-- Bottom Golden Wave Crest Finial -->
  <path d="M 46 145 L 49 149 L 52 147 L 50 152 L 46 156 L 42 152 L 40 147 L 43 149 Z" fill="url(#goldCapGrad)"/>
  <circle cx="46" cy="158" r="2.2" fill="url(#aquaGrad)"/>
  <circle cx="46" cy="158" r="1.0" fill="#ffffff" opacity="0.85"/>
</svg>
