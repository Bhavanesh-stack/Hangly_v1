    <circle cx="15.2" cy="112.5" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="18.2" cy="113.2" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="21.2" cy="114.5" r="1.0" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.25"/>

    <circle cx="14.2" cy="118.5" r="1.0" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.25"/>
    <circle cx="17.0" cy="119.5" r="1.0" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.25"/>
