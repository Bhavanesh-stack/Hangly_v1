<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 165" width="92" height="165">
  <defs>
    <!-- Cord & Bead Gradients -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c305c"/>
      <stop offset="50%" stop-color="#4a73b8"/>
      <stop offset="100%" stop-color="#0f1b36"/>
    </linearGradient>

    <!-- Metal Hoop & Wave Shading Gradients -->
    <linearGradient id="hoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a58a7"/>
      <stop offset="25%" stop-color="#1b3f7f"/>
      <stop offset="60%" stop-color="#0e234d"/>
      <stop offset="90%" stop-color="#17366d"/>
      <stop offset="100%" stop-color="#2d60b3"/>
    </linearGradient>

    <linearGradient id="hoopHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ea5f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#23529d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c1d3f" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="sapphireBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8ab9ff"/>
      <stop offset="35%" stop-color="#2a5eb5"/>
      <stop offset="75%" stop-color="#122f68"/>
      <stop offset="100%" stop-color="#06122b"/>
    </radialGradient>

    <!-- Platinum & Diamond Setting Gradients -->
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <radialGradient id="diamondGleam" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="95%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>

    <!-- Wave Sculpted Texture Gradients -->
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14346e"/>
      <stop offset="40%" stop-color="#1a428a"/>
      <stop offset="75%" stop-color="#0f2652"/>
      <stop offset="100%" stop-color="#08142c"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122b59"/>
      <stop offset="50%" stop-color="#2357a8"/>
      <stop offset="85%" stop-color="#3b7ad9"/>
      <stop offset="100%" stop-color="#6ba6f7"/>
    </linearGradient>

    <linearGradient id="waveCrestShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e468a"/>
      <stop offset="60%" stop-color="#132c57"/>
      <stop offset="100%" stop-color="#09152b"/>
    </linearGradient>

    <!-- Filter for Diamond Sparkle Glow -->
    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= TOP SUSPENSION CORD & THREADED BEADS ================= -->
  <!-- Hanging Silk Cord -->
  <line x1="46" y1="0" x2="46" y2="48" stroke="url(#cordGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Bead 1: Diamond Pave Rondelle (y: 11 - 19) -->
  <ellipse cx="46" cy="11.5" rx="6.2" ry="1.8" fill="url(#platGrad)"/>
  <ellipse cx="46" cy="15" rx="7.4" ry="4.2" fill="url(#platGrad)"/>
  <!-- Diamond row on Bead 1 -->
  <circle cx="41.2" cy="15" r="1.1" fill="url(#diamondGleam)"/>
  <circle cx="44.2" cy="15.8" r="1.3" fill="url(#diamondGleam)"/>
  <circle cx="47.8" cy="15.8" r="1.3" fill="url(#diamondGleam)"/>
  <circle cx="50.8" cy="15" r="1.1" fill="url(#diamondGleam)"/>
  <circle cx="46" cy="13.2" r="1.0" fill="#ffffff"/>
  <ellipse cx="46" cy="18.5" rx="6.2" ry="1.8" fill="#334155"/>

  <!-- Bead 2: Deep Sapphire Sphere with Diamond Spacer (y: 23 - 37) -->
  <ellipse cx="46" cy="23.2" rx="4.5" ry="1.4" fill="url(#platGrad)"/>
  <circle cx="46" cy="30" r="7.2" fill="url(#sapphireBead)"/>
  <!-- Specular curved highlight on sphere -->
  <ellipse cx="43.8" cy="27.4" rx="2.8" ry="1.6" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="46" cy="36.8" rx="4.5" ry="1.4" fill="#1e293b"/>

  <!-- Top Bail Loop with Diamond Setting (y: 43 - 56) -->
  <!-- Outer Bail Frame -->
  <path d="M 43.2 43 C 43.2 41.5 48.8 41.5 48.8 43 L 48.8 54.5 C 48.8 55.5 43.2 55.5 43.2 54.5 Z" fill="url(#platGrad)" stroke="#1e293b" stroke-width="0.7"/>
  <ellipse cx="46" cy="48" rx="1.6" ry="3.5" fill="#0f172a"/>
  <!-- Vertical column of pave diamonds on the bail -->
  <circle cx="44.5" cy="44.5" r="0.8" fill="#ffffff"/>
  <circle cx="47.5" cy="44.5" r="0.8" fill="#ffffff"/>
  <circle cx="44.5" cy="47.5" r="0.8" fill="#ffffff"/>
  <circle cx="47.5" cy="47.5" r="0.8" fill="#ffffff"/>
  <circle cx="44.5" cy="50.5" r="0.8" fill="#ffffff"/>
  <circle cx="47.5" cy="50.5" r="0.8" fill="#ffffff"/>
  <circle cx="46" cy="53.2" r="0.9" fill="#ffffff"/>

  <!-- ================= THE TALISMAN: CIRCULAR HOOP & GREAT WAVE PENDANT ================= -->
  <!-- Pendant Center at (46, 106), Outer Radius 38 -->

  <!-- 1. Ambient Drop Shadow -->
  <circle cx="46" cy="107" r="38.5" fill="#030712" opacity="0.32"/>

  <!-- 2. Outer Sculpted Blue Titanium Hoop Frame -->
  <!-- Base Outer Circle -->
  <circle cx="46" cy="106" r="38.5" fill="none" stroke="url(#hoopGrad)" stroke-width="3.8"/>
  <!-- Inner Bevel Accent -->
  <circle cx="46" cy="106" r="36.8" fill="none" stroke="#08142c" stroke-width="0.9" opacity="0.9"/>
  <!-- Outer Light Reflection Rim -->
  <path d="M 18 85 A 38.5 38.5 0 0 1 74 85" fill="none" stroke="url(#hoopHighlight)" stroke-width="1.2" opacity="0.85"/>
  <circle cx="46" cy="106" r="40.2" fill="none" stroke="#2563eb" stroke-width="0.5" opacity="0.45"/>

  <!-- 3. Wave Structure Rising from Lower Hoop -->
  <!-- Back Wall / Deep Cavity of the Wave (Provides rich dark relief behind the curling water) -->
  <path d="M 12 114
           C 12 96, 20 78, 36 71
           C 44 67, 52 70, 50 78
           C 48 83, 41 85, 36 94
           C 32 101, 33 112, 38 120
           C 43 128, 52 131, 62 127
           C 71 123, 78 111, 83 96
           C 85 106, 83 124, 76 133
           C 66 144, 46 146, 28 141
           C 18 135, 12 125, 12 114 Z"
        fill="url(#waveDeep)"/>

  <!-- 4. Main Towering Wave Body & Sculpted Water Flutes/Ripples -->
  <path d="M 11.5 116
           C 11.5 98, 18 83, 30 75
           C 37 70, 47 69, 51 74
           C 53 77, 51 81, 47 84
           C 42 86, 38 83, 33 87
           C 28 92, 27 101, 28 110
           C 29 120, 34 130, 44 135
           C 54 139, 68 135, 78 122
           C 82 116, 84 107, 84 98
           C 84.5 108, 83 123, 76 133
           C 65 145, 45 146.5, 27 141.5
           C 17 136, 11.5 127, 11.5 116 Z"
        fill="url(#waveMid)"/>

  <!-- Sculpted Concentric Flow Grooves (Fine engraved ripples along the wave body like the real jewelry) -->
  <path d="M 14.5 125 C 16 112, 22 96, 32 86 C 37 81, 43 78, 48 80"
        fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 17 131 C 20 118, 25 106, 34 97 C 39 92, 44 91, 48 94"
        fill="none" stroke="#93c5fd" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
  <path d="M 21 136 C 24 125, 29 114, 38 107 C 44 102, 49 104, 52 108"
        fill="none" stroke="#3b82f6" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 26 140 C 33 135, 40 125, 46 117 C 50 112, 54 113, 56 117"
        fill="none" stroke="#2563eb" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 33 143 C 44 142, 55 137, 65 128 C 72 121, 77 112, 80 102"
        fill="none" stroke="#60a5fa" stroke-width="1.0" stroke-linecap="round" opacity="0.65"/>
  <path d="M 39 144.5 C 50 143, 60 138, 70 128 C 76 121, 80 113, 82 106"
        fill="none" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 45 145.2 C 55 144, 66 138, 74 128 C 79 121, 82 116, 83.5 110"
        fill="none" stroke="#bfdbfe" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>

  <!-- 5. Secondary Inner Wave (Nestled in the center of the crest) -->
  <path d="M 36 130
           C 36 120, 39 110, 46 104
           C 51 99, 58 101, 57 107
           C 56 112, 51 113, 48 118
           C 45 123, 46 130, 50 136 Z"
