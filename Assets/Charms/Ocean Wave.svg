    <!-- 3. RISING SWELL & MID-TONE SURGE (Sweeping dynamic energy of the main wave) -->
    <path d="M 52 50
             C 63 53, 74 61, 81 74
             C 87 86, 88 102, 86 118
             C 84 134, 76 148, 63 155
             C 52 160, 38 159, 25 154
             C 34 149, 44 142, 54 133
             C 65 122, 73 107, 75 92
