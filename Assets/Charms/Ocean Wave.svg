  <!-- Flute lines on secondary wave -->
  <path d="M 41 127 C 42 119, 45 112, 49 108" fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.8"/>
  <path d="M 44 131 C 45 123, 48 117, 52 114" fill="none" stroke="#bfdbfe" stroke-width="0.7" opacity="0.75"/>

  <!-- 6. Sculpted Crest Claws & Diamond Bezel Settings -->
  <!-- Main Wave Crest Platinum Sculpted Base for Pave Setting -->
  <path d="M 28 85
           C 27 80, 29 74, 34 70
           C 39 66, 47 65, 51 71
           C 54 75, 54 80, 50 83
           C 47 85, 43 83, 40 85
           C 37 87, 36 90, 38 93
           C 40 95, 44 94, 47 92
           C 49 90, 52 91, 51 94
           C 48 98, 42 98, 38 96
           C 33 93, 31 89, 28 85 Z"
        fill="url(#platGrad)" stroke="#1e293b" stroke-width="0.6"/>

  <!-- Secondary Wave Crest Platinum Setting -->
  <path d="M 44 110
           C 44 105, 47 101, 52 101
           C 56 101, 58 105, 57 108
           C 55 111, 51 112, 49 116
           C 47 119, 45 115, 44 110 Z"
        fill="url(#platGrad)" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Left Flank Foam Spray Claws (Platinum Base) -->
  <path d="M 18 108 C 15 104, 16 97, 21 93 C 24 90, 27 94, 25 98 C 24 102, 21 104, 18 108 Z"
        fill="url(#platGrad)" stroke="#1e293b" stroke-width="0.5"/>
  <path d="M 14 117 C 12 113, 14 109, 17 107 C 19 105, 20 108, 19 112 C 17 115, 15 116, 14 117 Z"
        fill="url(#platGrad)" stroke="#1e293b" stroke-width="0.4"/>

