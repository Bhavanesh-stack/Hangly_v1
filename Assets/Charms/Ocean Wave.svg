    <!-- Big Crown Diamond -->
    <circle cx="43.5" cy="69.5" r="1.8" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.4"/>
    <polygon points="43.5,67.8 44.0,69.5 45.2,69.5 44.2,70.2 44.6,71.2 43.5,70.5 42.4,71.2 42.8,70.2 41.8,69.5 43.0,69.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="43.0" cy="69.0" r="0.5" fill="#ffffff"/>

    <!-- Arch Diamonds -->
    <circle cx="39.8" cy="71.0" r="1.5" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="39.4" cy="70.5" r="0.4" fill="#ffffff"/>

    <circle cx="36.5" cy="73.5" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="36.1" cy="73.0" r="0.4" fill="#ffffff"/>

    <circle cx="33.8" cy="76.8" r="1.5" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
