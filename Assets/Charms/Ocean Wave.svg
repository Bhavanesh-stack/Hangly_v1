      <circle cx="27" cy="87" r="0.9"/>
      <circle cx="22" cy="94" r="1.2"/>
      <circle cx="38" cy="91" r="1.0"/>
      <circle cx="43" cy="86" r="0.8"/>
      <circle cx="48" cy="93" r="1.1"/>
      <circle cx="54" cy="90" r="0.9"/>
      <circle cx="44" cy="101" r="1.2"/>
      <circle cx="49" cy="106" r="1.0"/>
      <circle cx="55" cy="102" r="1.1"/>
      <circle cx="60" cy="97" r="0.8"/>

      <circle cx="37" cy="110" r="1.0"/>
      <circle cx="42" cy="116" r="1.2"/>
