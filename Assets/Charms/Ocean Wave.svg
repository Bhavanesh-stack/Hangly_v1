    <circle cx="46.8" cy="105.0" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="52.8" cy="104.5" r="1.4" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="55.5" cy="107.0" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <circle cx="44.8" cy="108.8" r="1.2" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>
