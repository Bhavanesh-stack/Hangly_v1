  <!-- Bottom Rim Connection Accent (Where the hoop seamlessly welds at base) -->
  <path d="M 42 144.5 C 44 145 48 145 50 144.5 L 48 147 C 46 147.5 44 147.5 44 147 Z" fill="url(#hoopGrad)"/>
</svg>
