<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Charm Library</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <div class="library-layout">
    <!-- Left: Catalog & Filter -->
    <div class="catalog-panel">
      <header class="catalog-header">
        <h1>Charm Library</h1>
        <div class="filter-chips">
          <button class="chip active" data-cat="all">All</button>
          <button class="chip" data-cat="protection">Protection</button>
          <button class="chip" data-cat="luck">Luck & Fortune</button>
          <button class="chip" data-cat="ritual">Ritual & Home</button>
          <button class="chip" data-cat="onepiece">One Piece 🏴‍☠️</button>
          <button class="chip" data-cat="classic">Classic</button>
          <button class="chip" data-cat="custom">Custom</button>
        </div>
      </header>

      <div class="charm-grid" id="charm-grid">
        <!-- Charm Cards populated by library.js -->
      </div>
    </div>

    <!-- Right: Charm Detail Pane -->
    <aside class="detail-panel" id="detail-panel">
      <div class="preview-stage">
        <canvas id="detail-canvas" width="220" height="240"></canvas>
      </div>

      <div class="detail-info">
        <div class="detail-title-row">
          <h2 id="detail-name">Daruma</h2>
          <span class="category-tag" id="detail-category">Luck & Fortune</span>
        </div>
        <p class="detail-region" id="detail-region">Japan</p>
        <p class="detail-desc" id="detail-desc">A round, weighted doll modelled on the monk Bodhidharma. You paint one eye while making a wish and the other when it comes true, and it always rights itself when knocked over.</p>

        <div class="tags-container" id="detail-tags">
          <!-- Tags -->
        </div>

        <div class="specs-grid">
          <div class="spec-item">
            <span class="spec-label">Weight</span>
            <span class="spec-val" id="detail-mass">3.65</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Material</span>
            <span class="spec-val" id="detail-sound">Wood</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Beads</span>
            <span class="spec-val" id="detail-beads">3</span>
          </div>
        </div>

        <!-- Edit Charm Section -->
        <div class="edit-section">
          <div class="edit-section-header">
            <span class="edit-section-title">Customize Charm</span>
            <button id="btn-reset-custom" class="text-btn" title="Reset this charm to defaults">Reset</button>
          </div>

          <div class="edit-row">
            <div class="edit-label-row">
              <label for="edit-size">Charm Size</label>
              <span class="edit-val-badge" id="edit-size-val">100%</span>
            </div>
            <input type="range" id="edit-size" class="slider" min="50" max="250" step="5" value="100">
          </div>

          <div class="edit-row">
            <div class="edit-label-row">
              <label for="edit-sound">Resonance Sound</label>
              <button id="btn-test-sound" class="sound-test-btn" title="Test sound">🔊 Test</button>
            </div>
            <select id="edit-sound" class="select-dropdown">
              <option value="drum">🥁 Drum (Liberation Beat)</option>
              <option value="slash">⚔️ Slash (Katana Steel)</option>
              <option value="coin">🪙 Coin (Golden Beri)</option>
              <option value="kick">🔥 Kick (Diable Flame)</option>
              <option value="wave">🌊 Wave (Ocean Swell)</option>
              <option value="wood">🪵 Wood (Warm Knock)</option>
              <option value="bell">🔔 Bell (Temple Chime)</option>
              <option value="glass">🍷 Glass (Crystal Ping)</option>
              <option value="metal">🛡️ Metal (Resonant Ring)</option>
              <option value="soft">☁️ Soft (Gentle Thud)</option>
            </select>
          </div>

          <div class="edit-row">
            <div class="edit-label-row">
              <label for="edit-mass">Weight (Mass)</label>
              <span class="edit-val-badge" id="edit-mass-val">3.00</span>
            </div>
            <input type="range" id="edit-mass" class="slider" min="1.0" max="8.0" step="0.1" value="3.0">
          </div>
        </div>

        <button id="btn-hang-charm" class="primary-btn">Hang this Charm</button>
      </div>
    </aside>
  </div>
  <script src="library.js"></script>
</body>
</html>
