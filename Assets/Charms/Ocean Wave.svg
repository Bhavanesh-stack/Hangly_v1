<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 165" width="94" height="165">
  <defs>
    <!-- Cord & Bead Gradients -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3b2c"/>
      <stop offset="50%" stop-color="#8c7355"/>
      <stop offset="100%" stop-color="#36291c"/>
    </linearGradient>

    <radialGradient id="goldCapGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>

    <radialGradient id="pearlGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <radialGradient id="lapisGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#1d4ed8"/>
      <stop offset="75%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Medallion Rim & Washi Paper Gradients -->
    <radialGradient id="rimGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <linearGradient id="washiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcd7ca"/>
      <stop offset="50%" stop-color="#d3cdbe"/>
      <stop offset="100%" stop-color="#c5bfaf"/>
    </linearGradient>

    <!-- Authentic Prussian & Indigo Gradients -->
    <linearGradient id="waveDeep" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081b33"/>
      <stop offset="40%" stop-color="#0e2a52"/>
      <stop offset="80%" stop-color="#153e78"/>
      <stop offset="100%" stop-color="#0a1d38"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10366b"/>
      <stop offset="40%" stop-color="#184b94"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="waveHollow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#051224"/>
      <stop offset="60%" stop-color="#0a2142"/>
      <stop offset="100%" stop-color="#133566"/>
    </linearGradient>

    <!-- Foam Gradients -->
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="90%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Clip Path for Circular Medallion (Center 47, 105, radius 38) -->
    <clipPath id="circleDiscClip">
      <circle cx="47" cy="105" r="38"/>
    </clipPath>

    <!-- Drop Shadow for the Circular Medallion -->
    <filter id="discShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.8" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= TOP SUSPENSION CORD & THREADED BEADS ================= -->
  <!-- Silk Hanging Cord (y: 0 to 48) -->
  <line x1="47" y1="0" x2="47" y2="48" stroke="url(#cordGrad)" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Bead 1: Pearl Bead with Gold Caps (y: 11 - 18) -->
  <path d="M 43 9.5 Q 47 11.5 51 9.5 L 50.5 8.5 Q 47 10.5 43.5 8.5 Z" fill="url(#goldCapGrad)"/>
  <circle cx="47" cy="14" r="5.8" fill="url(#pearlGrad)"/>
  <ellipse cx="45.2" cy="12.2" rx="2.0" ry="1.2" fill="#ffffff" opacity="0.9"/>
  <path d="M 43 18.5 Q 47 16.5 51 18.5 L 50.5 19.5 Q 47 17.5 43.5 19.5 Z" fill="url(#goldCapGrad)"/>

  <!-- Bead 2: Lapis Lazuli Bead with Gold Caps (y: 23 - 36) -->
  <path d="M 42 22.5 Q 47 24.5 52 22.5 L 51.5 21.5 Q 47 23.5 42.5 21.5 Z" fill="url(#goldCapGrad)"/>
  <circle cx="47" cy="29" r="6.8" fill="url(#lapisGrad)"/>
  <ellipse cx="45.0" cy="26.5" rx="2.5" ry="1.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="49.5" cy="30.5" r="0.9" fill="#fef08a" opacity="0.85"/>
  <path d="M 42 35.5 Q 47 33.5 52 35.5 L 51.5 36.5 Q 47 34.5 42.5 36.5 Z" fill="url(#goldCapGrad)"/>

  <!-- Attachment Knot Ring (y: 40 - 48) -->
  <circle cx="47" cy="44.5" r="4.4" fill="none" stroke="url(#goldCapGrad)" stroke-width="2.4"/>
  <circle cx="47" cy="44.5" r="2.0" fill="#2d1a04"/>

  <!-- ================= THE CIRCULAR GREAT WAVE MEDALLION ================= -->
  <!-- Medallion Center (47, 105), Outer Radius 39.5 -->
  <g filter="url(#discShadow)">

    <!-- 1. Outer Bezel / Rim Frame -->
    <circle cx="47" cy="105" r="39.8" fill="url(#rimGrad)"/>
    <circle cx="47" cy="105" r="38.3" fill="#2e1905"/>

    <!-- 2. Clipped Content of the Great Wave Artwork -->
    <g clip-path="url(#circleDiscClip)">

      <!-- Washi Paper Background (Exact tone from reference image) -->
      <rect x="8" y="66" width="78" height="78" fill="url(#washiSky)"/>

      <!-- Distant Sea Surface at Base -->
      <rect x="8" y="125" width="78" height="25" fill="#081b33"/>

      <!-- 3. THE TOWERING GREAT WAVE BODY (Rises along right wall, crests to top-left) -->
      <!-- Base Deep Water Mass -->
      <path d="M 9 143
               C 9 130, 15 120, 24 115
               C 33 110, 42 109, 50 102
               C 58 95, 62 82, 59 71
               C 56 63, 50 59, 44 62
               C 38 65, 33 73, 27 79
               C 34 68, 44 57, 56 53
               C 68 49, 78 57, 83 72
               C 87 87, 87 106, 85 124
               C 83 138, 77 146, 68 147
               L 9 147 Z"
            fill="url(#waveDeep)"/>

      <!-- Inner Wave Hollow / Barrel (Deep dark cavity under the curl) -->
      <path d="M 80 82
               C 78 98, 69 116, 56 128
               C 44 137, 30 138, 18 134
               C 24 128, 33 123, 41 117
               C 50 110, 56 99, 54 87
               C 52 77, 46 72, 40 75
               C 47 67, 58 63, 67 67
               C 74 71, 79 76, 80 82 Z"
            fill="url(#waveHollow)"/>

      <!-- Rising Mid-Tone Swell Layer -->
      <path d="M 58 53
               C 69 56, 78 66, 83 80
               C 87 94, 87 110, 85 126
               C 83 140, 75 146, 65 146
               C 55 146, 44 140, 36 133
               C 46 127, 56 120, 65 109
               C 74 98, 79 84, 76 71
               C 74 62, 68 56, 58 53 Z"
            fill="url(#waveMid)"/>

      <!-- Japanese Curved Water Striations (Contour lines along the wave sweep) -->
      <path d="M 84 96 C 85 112, 81 127, 72 139 C 63 146, 52 147, 40 147"
            fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
      <path d="M 81 86 C 83 102, 78 118, 69 130 C 60 140, 48 144, 36 144"
            fill="none" stroke="#7dd3fc" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
      <path d="M 76 76 C 78 92, 73 108, 64 121 C 55 131, 43 136, 32 137"
            fill="none" stroke="#bae6fd" stroke-width="1.0" stroke-linecap="round" opacity="0.75"/>
      <path d="M 69 66 C 72 81, 67 97, 58 110 C 49 121, 38 126, 27 128"
            fill="none" stroke="#e0f2fe" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>

      <!-- Additional fine current lines -->
      <path d="M 85 112 C 85 125, 79 138, 70 144"
            fill="none" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
      <path d="M 62 57 C 65 70, 61 85, 53 97 C 46 107, 37 114, 28 119"
            fill="none" stroke="#bae6fd" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
      <path d="M 54 53 C 57 64, 54 75, 47 86 C 42 94, 34 100, 26 105"
            fill="none" stroke="#7dd3fc" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

      <!-- 4. LOWER FOREGROUND WAVE (Surging lower crest with foam in front) -->
      <path d="M 9 144
               C 9 132, 15 123, 23 118
               C 31 113, 40 112, 48 107
               C 54 102, 57 93, 54 86
               C 51 81, 46 80, 42 84
               C 37 88, 34 96, 29 103
               C 23 111, 15 114, 9 116
               L 9 144 Z"
            fill="url(#waveMid)"/>

      <!-- Churning water lines on foreground wave -->
      <path d="M 10 134 C 13 125, 20 118, 28 114 C 36 110, 45 108, 51 102"
            fill="none" stroke="#bae6fd" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
      <path d="M 14 140 C 18 132, 26 125, 35 121 C 43 117, 51 114, 56 108"
            fill="none" stroke="#7dd3fc" stroke-width="1.0" stroke-linecap="round" opacity="0.75"/>

      <!-- 5. WHITE WAVE CRESTS & HOKUSAI FOAM CLAWS -->
      <!-- High Crest Foam Base -->
      <path d="M 52 50
               C 59 50, 68 54, 75 62
               C 80 70, 84 80, 83 91
               C 80 90, 77 87, 75 89
               C 73 91, 74 94, 72 96
               C 70 98, 67 95, 65 97
               C 63 99, 64 102, 62 104
               C 60 106, 57 102, 54 105
               C 51 108, 53 112, 50 115
               C 47 118, 44 114, 41 117
               C 38 120, 40 124, 37 127
               C 34 130, 29 127, 26 131
               C 23 134, 25 139, 21 142
               C 18 145, 12 142, 9 145
               C 8 140, 11 133, 16 129
               C 21 125, 27 123, 31 117
               C 35 111, 33 105, 38 99
               C 42 93, 49 89, 52 82
               C 55 75, 52 67, 48 62
               C 44 57, 39 56, 36 61
               C 40 54, 46 51, 52 50 Z"
            fill="url(#foamGrad)"/>

      <!-- Distinctive Hokusai Claws / Fingers (Reaching down from crest) -->
      <!-- Finger 1 -->
      <path d="M 48 62 C 51 66, 50 74, 46 78 C 43 81, 38 83, 35 87 C 32 91, 33 96, 29 99 C 27 100, 24 98, 25 95 C 27 90, 31 86, 35 82 C 39 78, 42 73, 41 68 C 40 64, 44 61, 48 62 Z"
            fill="#ffffff"/>
      <!-- Finger 2 -->
      <path d="M 44 54 C 38 58, 32 64, 25 70 C 21 74, 17 79, 14 85 C 13 87, 11 86, 11 84 C 12 78, 17 72, 22 66 C 28 59, 36 52, 44 54 Z"
            fill="#ffffff"/>
      <!-- Finger 3 -->
      <path d="M 54 69 C 58 74, 57 82, 53 87 C 50 91, 45 93, 43 98 C 41 101, 43 104, 40 106 C 38 107, 36 105, 37 102 C 39 97, 43 93, 46 89 C 50 84, 51 77, 49 72 C 48 68, 51 66, 54 69 Z"
            fill="#ffffff"/>
      <!-- Finger 4 -->
      <path d="M 62 81 C 65 86, 64 93, 60 98 C 57 102, 52 105, 50 110 C 48 113, 50 116, 47 118 C 45 119, 43 117, 44 114 C 46 109, 50 105, 53 101 C 57 96, 58 89, 56 84 C 55 80, 59 78, 62 81 Z"
            fill="#ffffff"/>
      <!-- Finger 5 -->
      <path d="M 70 92 C 72 97, 71 103, 67 108 C 64 112, 59 115, 57 120 C 55 123, 57 126, 54 128 C 52 129, 50 127, 51 124 C 53 119, 57 115, 60 111 C 64 106, 65 99, 63 94 C 62 90, 67 89, 70 92 Z"
            fill="#ffffff"/>

      <!-- Crest top hooks -->
      <path d="M 53 49 C 50 46, 45 47, 42 50 C 40 52, 41 54, 44 53 C 47 51, 51 51, 53 49 Z" fill="#ffffff"/>
      <path d="M 60 51 C 58 47, 53 47, 50 50 C 49 52, 51 53, 53 52 C 56 51, 59 52, 60 51 Z" fill="#ffffff"/>
      <path d="M 68 55 C 66 51, 61 50, 58 53 C 57 55, 59 56, 61 55 C 64 54, 67 56, 68 55 Z" fill="#ffffff"/>
      <path d="M 76 63 C 75 59, 70 58, 67 61 C 66 63, 68 64, 70 63 C 73 62, 75 64, 76 63 Z" fill="#ffffff"/>

      <!-- Foreground Wave Foam Claws -->
      <path d="M 9 112 C 14 108, 20 105, 27 101 C 33 97, 39 93, 44 87 C 46 85, 48 88, 46 90 C 41 96, 34 101, 28 105 C 21 109, 14 113, 9 117 Z"
            fill="#ffffff"/>
      <path d="M 15 123 C 20 119, 26 115, 33 111 C 39 107, 45 103, 50 97 C 51 95, 53 97, 52 99 C 47 105, 41 109, 34 113 C 27 117, 20 121, 15 126 Z"
            fill="#ffffff"/>

      <!-- 6. WHITE SEA SPRAY DROPLETS (Drifting through the washi sky) -->
      <g fill="#ffffff" opacity="0.95">
        <circle cx="38" cy="52" r="1.3"/>
        <circle cx="32" cy="57" r="1.1"/>
        <circle cx="26" cy="63" r="1.4"/>
        <circle cx="20" cy="69" r="1.2"/>
        <circle cx="15" cy="76" r="1.5"/>
        <circle cx="11" cy="83" r="1.2"/>

        <circle cx="35" cy="48" r="0.9"/>
        <circle cx="29" cy="53" r="1.0"/>
        <circle cx="23" cy="58" r="0.8"/>
        <circle cx="17" cy="64" r="1.1"/>
        <circle cx="12" cy="71" r="0.9"/>

        <circle cx="42" cy="46" r="0.8"/>
        <circle cx="47" cy="43" r="1.0"/>
        <circle cx="53" cy="43" r="0.9"/>
        <circle cx="60" cy="46" r="1.1"/>
        <circle cx="67" cy="49" r="0.9"/>
        <circle cx="74" cy="55" r="1.2"/>
        <circle cx="80" cy="62" r="1.0"/>

        <!-- Fine mist in sky area -->
        <circle cx="21" cy="52" r="0.6" opacity="0.85"/>
        <circle cx="15" cy="58" r="0.6" opacity="0.85"/>
        <circle cx="27" cy="47" r="0.6" opacity="0.8"/>
        <circle cx="33" cy="42" r="0.7" opacity="0.8"/>
        <circle cx="41" cy="40" r="0.6" opacity="0.75"/>
        <circle cx="50" cy="39" r="0.7" opacity="0.75"/>
        <circle cx="58" cy="40" r="0.6" opacity="0.75"/>
        <circle cx="66" cy="43" r="0.7" opacity="0.8"/>
        <circle cx="73" cy="48" r="0.6" opacity="0.8"/>

        <!-- Spray in hollow -->
        <circle cx="36" cy="86" r="1.1"/>
        <circle cx="30" cy="91" r="0.9"/>
        <circle cx="25" cy="98" r="1.2"/>
        <circle cx="41" cy="95" r="1.0"/>
        <circle cx="46" cy="90" r="0.8"/>
        <circle cx="51" cy="97" r="1.1"/>
        <circle cx="57" cy="94" r="0.9"/>
        <circle cx="47" cy="105" r="1.2"/>
      </g>
    </g>

    <!-- 7. Inner Bezel Ring & Specular Glass Highlight -->
    <circle cx="47" cy="105" r="38" fill="none" stroke="url(#goldCapGrad)" stroke-width="1.6" opacity="0.95"/>
    <circle cx="47" cy="105" r="37" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.5"/>
  </g>
</svg>
