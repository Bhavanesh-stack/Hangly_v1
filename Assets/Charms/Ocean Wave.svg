      <circle cx="17" cy="65" r="1.2"/>
      <circle cx="12" cy="72" r="1.5"/>
      <circle cx="8" cy="79" r="1.2"/>
      <circle cx="5" cy="87" r="1.0"/>

      <circle cx="31" cy="44" r="0.9"/>
      <circle cx="25" cy="49" r="1.0"/>
      <circle cx="19" cy="54" r="0.8"/>
      <circle cx="14" cy="60" r="1.1"/>
      <circle cx="9" cy="67" r="0.9"/>

      <circle cx="38" cy="42" r="0.8"/>
      <circle cx="43" cy="39" r="1.0"/>
      <circle cx="49" cy="39" r="0.9"/>
      <circle cx="56" cy="42" r="1.1"/>
      <circle cx="63" cy="45" r="0.9"/>
      <circle cx="70" cy="51" r="1.2"/>
      <circle cx="76" cy="58" r="1.0"/>
      <circle cx="82" cy="67" r="1.1"/>
      <circle cx="86" cy="76" r="1.3"/>
      <circle cx="87" cy="85" r="1.0"/>

      <!-- Interior hollow spray mist -->
