<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 165" width="94" height="165">
  <defs>
    <!-- Hanging Cord & Bead Gradients -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#023e8a"/>
      <stop offset="50%" stop-color="#0096c7"/>
      <stop offset="100%" stop-color="#03045e"/>
    </linearGradient>

    <radialGradient id="pearlBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>

    <radialGradient id="aquaBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0fbfc"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034078"/>
    </radialGradient>

    <!-- Wave Body Gradients (Apple 🌊 iOS Aesthetic) -->
    <linearGradient id="waveDeepBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0353a4"/>
      <stop offset="45%" stop-color="#023e8a"/>
      <stop offset="85%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#001845"/>
    </linearGradient>

    <linearGradient id="waveHollowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="60%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#0353a4"/>
    </linearGradient>

    <linearGradient id="waveMidTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096c7"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <linearGradient id="waveBackWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="40%" stop-color="#0096c7"/>
      <stop offset="80%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>

    <!-- Foam Shading Gradients (Puffy 3D Cloud Foam) -->
    <linearGradient id="foamTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f9ff"/>
      <stop offset="80%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <linearGradient id="foamUnderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Drop Shadow for the 3D Emoji Cutout -->
    <filter id="emojiShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#001233" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ================= TOP SUSPENSION CORD & THREADED BEADS ================= -->
  <!-- Hanging Cord (y: 0 to 48) -->
  <line x1="47" y1="0" x2="47" y2="48" stroke="url(#cordGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Bead 1: Shimmering Ocean Pearl Bead (y: 11 - 18) -->
  <circle cx="47" cy="14.5" r="5.6" fill="url(#pearlBead)"/>
  <ellipse cx="45.4" cy="12.8" rx="2.0" ry="1.2" fill="#ffffff" opacity="0.9"/>
  <!-- Silver spacer caps -->
  <ellipse cx="47" cy="9.2" rx="3.0" ry="1.0" fill="#93c5fd"/>
  <ellipse cx="47" cy="19.8" rx="3.0" ry="1.0" fill="#60a5fa"/>

  <!-- Bead 2: Aquamarine Glass Bead (y: 23 - 36) -->
  <circle cx="47" cy="29.5" r="6.8" fill="url(#aquaBead)"/>
  <ellipse cx="44.8" cy="26.8" rx="2.5" ry="1.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="49.2" cy="31.2" r="1.1" fill="#e0fbfc" opacity="0.8"/>
  <ellipse cx="47" cy="36.5" rx="3.8" ry="1.2" fill="#0284c7"/>

  <!-- Attachment Loop / Knot Ring (y: 40 - 48) -->
  <circle cx="47" cy="44.5" r="4.2" fill="none" stroke="url(#pearlBead)" stroke-width="2.2"/>
  <circle cx="47" cy="44.5" r="2.0" fill="#001845"/>

  <!-- ================= THE WAVE (AUTHENTIC APPLE 🌊 EMOJI CUTOUT) ================= -->
  <g filter="url(#emojiShadow)">

    <!-- 1. BASE DARK BLUE BACK WATER BODY -->
    <path d="M 47 48
             C 41 48, 33 53, 27 60
             C 21 68, 17 78, 15 90
             C 13 104, 13 120, 13 136
             C 13 147, 16 153, 25 153
             C 40 153, 58 153, 81 153
             C 83 153, 85 148, 85 140
             C 85 125, 78 116, 68 112
             C 57 108, 48 98, 46 88
             C 45 80, 48 72, 53 66
             C 57 61, 62 60, 60 54
             C 58 50, 52 48, 47 48 Z"
          fill="url(#waveDeepBlue)"/>

    <!-- 2. MAIN CURVING BACK WALL (Smooth Cyan-to-Cobalt Gradient Sweep) -->
    <path d="M 46 51
             C 38 52, 29 58, 23 67
             C 17 77, 14 91, 14 108
             C 14 122, 16 136, 21 146
             C 24 151, 30 152, 38 152
             C 48 152, 56 148, 62 142
             C 71 133, 76 122, 80 114
             C 84 120, 84 129, 84 140
             C 84 148, 82 152, 80 152
             L 24 152
             C 16 152, 14 146, 14 135
             C 14 116, 17 100, 22 88
             C 28 74, 37 63, 46 55
             C 52 50, 57 50, 58 53
             C 56 57, 50 58, 46 62
             C 41 67, 43 76, 47 80
             C 51 84, 58 84, 60 76
             C 61 71, 58 66, 54 62
             C 52 60, 50 55, 46 51 Z"
          fill="url(#waveBackWall)"/>

    <!-- 3. INNER BARREL / CAVITY (Deep Midnight Blue Hollow under the crest) -->
    <path d="M 45 68
             C 40 73, 38 82, 41 89
             C 44 95, 52 98, 59 93
             C 65 89, 67 80, 64 74
             C 62 70, 57 68, 52 71
             C 48 73, 46 71, 45 68 Z"
          fill="url(#waveHollowDark)"/>

    <!-- 4. DIAGONAL WATER FLUTES / STRIATIONS (Characteristic Apple 🌊 flowing ribbons) -->
    <!-- Ribbon 1 (Topmost highlight stripe) -->
    <path d="M 23 92 C 28 85, 36 82, 45 84 C 54 86, 61 95, 68 103 C 74 110, 80 115, 84 116"
          fill="none" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

    <!-- Ribbon 2 (Cyan mid-stripe) -->
    <path d="M 20 106 C 24 99, 32 96, 41 99 C 50 102, 58 111, 66 119 C 72 125, 78 128, 84 128"
          fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

    <!-- Ribbon 3 (Cobalt stripe) -->
    <path d="M 18 118 C 22 112, 30 109, 39 113 C 48 117, 56 126, 64 133 C 70 138, 77 140, 83 139"
          fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

    <!-- Ribbon 4 (Deep blue contrast stripe) -->
    <path d="M 17 129 C 22 124, 30 122, 39 126 C 48 130, 56 138, 64 143 C 70 147, 76 148, 81 146"
          fill="none" stroke="#0284c7" stroke-width="2.0" stroke-linecap="round" opacity="0.75"/>

    <!-- Ribbon 5 (Bottom subtle stripe) -->
    <path d="M 16 140 C 21 136, 29 135, 38 138 C 47 141, 55 147, 63 150 C 69 152, 75 152, 79 151"
          fill="none" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- 5. MID-LEVEL WAVE SURGE (Lower front curling wave) -->
    <path d="M 14 120
             C 14 105, 18 95, 26 88
             C 33 82, 42 81, 49 85
             C 55 88, 59 95, 64 101
             C 69 107, 75 111, 82 113
             C 77 120, 71 127, 63 133
             C 54 139, 44 142, 33 142
             C 24 142, 17 135, 14 120 Z"
          fill="url(#waveMidTone)"/>

    <!-- Water current highlights on the mid-level surge -->
    <path d="M 21 96 C 26 91, 33 89, 41 91 C 49 93, 56 100, 62 107"
          fill="none" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 18 108 C 23 103, 31 101, 39 104 C 47 107, 54 114, 60 120"
          fill="none" stroke="#bae6fd" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>

    <!-- ================= 6. THE BILLOWY FOAM CRESTS (3D APPLE EMOJI FOAM) ================= -->
    <!-- SECONDARY WAVE LOWER FOAM (Underside Shadow) -->
    <path d="M 14 116
             C 16 112, 19 113, 21 110
             C 23 107, 24 104, 27 103
             C 30 102, 32 105, 35 103
             C 38 101, 39 97, 43 96
             C 47 95, 50 99, 54 99
             C 58 99, 61 95, 65 96
             C 69 97, 71 101, 75 103
             C 79 105, 82 105, 84 108
             C 82 114, 76 117, 70 119
             C 64 121, 57 117, 52 119
             C 47 121, 44 125, 39 126
             C 34 127, 30 123, 26 124
             C 21 125, 17 127, 14 129 Z"
          fill="url(#foamUnderGrad)"/>

    <!-- SECONDARY WAVE LOWER FOAM (Crisp White & Cyan Puffy Head) -->
    <path d="M 14 113
             C 16 109, 19 110, 21 107
             C 23 104, 24 101, 27 100
             C 30 99, 32 102, 35 100
             C 38 98, 39 94, 43 93
             C 47 92, 50 96, 54 96
             C 58 96, 61 92, 65 93
             C 69 94, 71 98, 75 100
             C 79 102, 82 102, 84 105
             C 80 109, 74 112, 68 113
             C 62 114, 56 111, 51 113
             C 46 115, 43 118, 38 119
             C 33 120, 29 117, 25 118
             C 20 119, 16 121, 14 123 Z"
          fill="url(#foamTopGrad)"/>

    <!-- Foam puff bubbles on secondary wave -->
    <circle cx="27" cy="104" r="3.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="36" cy="102" r="3.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="45" cy="98" r="4.0" fill="#ffffff" opacity="0.95"/>
    <circle cx="55" cy="99" r="3.8" fill="#ffffff" opacity="0.95"/>
    <circle cx="65" cy="100" r="3.4" fill="#ffffff" opacity="0.95"/>
    <circle cx="74" cy="103" r="3.0" fill="#ffffff" opacity="0.95"/>

    <!-- ================= 7. TOP TOWERING CREST FOAM (The Big 🌊 Emoji Curl) ================= -->
    <!-- Top Crest Underside Shadow (Soft Cyan-Blue Shading) -->
    <path d="M 44 48
             C 36 49, 29 55, 23 64
             C 17 73, 13 85, 12 99
             C 13 103, 17 101, 19 97
             C 21 93, 21 87, 24 84
             C 27 81, 31 82, 34 78
             C 37 74, 36 68, 40 65
             C 44 62, 48 64, 52 61
             C 56 58, 56 53, 60 52
             C 64 51, 68 55, 72 56
             C 76 57, 80 54, 82 56
             C 80 62, 74 65, 70 68
             C 66 71, 64 76, 59 78
             C 54 80, 50 78, 47 81
             C 44 84, 45 88, 42 90
             C 39 92, 36 89, 33 91
             C 30 93, 29 97, 26 98
             C 23 99, 20 97, 18 99
             C 19 93, 23 83, 28 75
             C 34 66, 42 59, 50 54
             C 55 51, 51 48, 44 48 Z"
          fill="url(#foamUnderGrad)"/>

    <!-- Main High Foam Cap (Crisp Billowy White with Cyan Tint) -->
    <path d="M 45 46
             C 37 47, 29 53, 24 61
             C 18 70, 14 81, 13 94
             C 15 97, 18 95, 20 92
             C 22 88, 22 83, 25 80
             C 28 77, 32 78, 35 74
             C 38 70, 37 65, 41 62
             C 45 59, 49 61, 53 58
             C 57 55, 57 51, 61 50
             C 65 49, 69 53, 73 54
             C 76 55, 80 52, 82 54
             C 78 58, 73 61, 69 64
             C 65 67, 63 72, 58 74
             C 53 76, 49 74, 46 77
             C 43 80, 44 84, 41 86
             C 38 88, 35 85, 32 87
             C 29 89, 28 93, 25 94
             C 22 95, 19 93, 17 95
             C 18 89, 22 80, 27 72
             C 33 63, 41 56, 49 51
             C 53 48, 49 46, 45 46 Z"
          fill="url(#foamTopGrad)"/>

    <!-- Characteristic Rounded Apple Foam Claws / Fingers (Curling over the crest) -->
    <!-- Claw 1 (Topmost rounded hook) -->
    <path d="M 52 50 C 58 48, 64 49, 68 53 C 71 56, 73 60, 71 63 C 69 65, 66 64, 65 61 C 64 58, 61 56, 58 56 C 54 56, 52 53, 52 50 Z"
          fill="#ffffff"/>

    <!-- Claw 2 (Down-curling rounded finger) -->
    <path d="M 59 58 C 64 56, 68 59, 70 63 C 71 67, 69 71, 65 73 C 62 74, 60 72, 61 69 C 62 66, 61 63, 58 63 C 55 63, 56 59, 59 58 Z"
          fill="#ffffff"/>

    <!-- Claw 3 (Mid-curl rounded finger) -->
    <path d="M 48 64 C 53 62, 57 65, 59 69 C 60 73, 58 77, 54 79 C 51 80, 49 78, 50 75 C 51 72, 49 70, 47 70 C 45 70, 45 66, 48 64 Z"
          fill="#ffffff"/>

    <!-- Claw 4 (Leftmost inner curling claw) -->
    <path d="M 40 70 C 44 68, 48 71, 49 75 C 50 78, 48 82, 44 83 C 41 84, 40 81, 41 79 C 42 76, 40 74, 38 74 C 36 74, 37 71, 40 70 Z"
          fill="#ffffff"/>

    <!-- 3D Puffy Foam Highlights (Gleaming white spherical crest tops) -->
    <circle cx="26" cy="65" r="4.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="34" cy="56" r="5.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="43" cy="50" r="5.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="53" cy="49" r="4.8" fill="#ffffff" opacity="0.95"/>
    <circle cx="63" cy="52" r="4.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="73" cy="56" r="3.8" fill="#ffffff" opacity="0.95"/>

    <!-- Floating Sea Spray Bubbles / Droplets (Clean iOS emoji style) -->
    <circle cx="67" cy="44" r="1.8" fill="#ffffff" opacity="0.95"/>
    <circle cx="75" cy="47" r="1.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="80" cy="51" r="1.3" fill="#ffffff" opacity="0.95"/>
    <circle cx="76" cy="63" r="1.4" fill="#ffffff" opacity="0.95"/>
    <circle cx="71" cy="72" r="1.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="65" cy="78" r="1.4" fill="#ffffff" opacity="0.95"/>

    <!-- Extra spray mist dots -->
    <circle cx="60" cy="42" r="1.1" fill="#e0f2fe" opacity="0.9"/>
    <circle cx="71" cy="41" r="1.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="83" cy="47" r="1.0" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
