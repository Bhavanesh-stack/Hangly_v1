    <circle cx="29.2" cy="84.5" r="1.3" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.35"/>
    <circle cx="27.8" cy="88.5" r="1.1" fill="url(#diamondGleam)" stroke="#475569" stroke-width="0.3"/>

    <!-- Right Crest Curl Diamonds -->
