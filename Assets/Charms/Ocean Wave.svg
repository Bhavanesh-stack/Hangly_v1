<?xml version="1.0" encoding="UTF-8"?>
<svg id="OceanWave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 165" width="94" height="165">
  <defs>

    <!-- ===== CORD & BEAD GRADIENTS ===== -->
    <linearGradient id="ow-cord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b2e1a"/>
      <stop offset="30%"  stop-color="#7a5e33"/>
      <stop offset="60%"  stop-color="#a07c44"/>
      <stop offset="100%" stop-color="#3b2e1a"/>
    </linearGradient>

    <radialGradient id="ow-gold" cx="38%" cy="28%" r="68%">
      <stop offset="0%"   stop-color="#fff0a0"/>
      <stop offset="35%"  stop-color="#f0c030"/>
      <stop offset="70%"  stop-color="#c88000"/>
      <stop offset="100%" stop-color="#6b3a00"/>
    </radialGradient>

    <radialGradient id="ow-pearl" cx="35%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#e8eef8"/>
      <stop offset="80%"  stop-color="#b8c8dc"/>
      <stop offset="100%" stop-color="#607090"/>
    </radialGradient>

    <radialGradient id="ow-lapis" cx="32%" cy="25%" r="72%">
      <stop offset="0%"   stop-color="#7ab0f0"/>
      <stop offset="30%"  stop-color="#2060d0"/>
      <stop offset="65%"  stop-color="#123888"/>
      <stop offset="100%" stop-color="#060f28"/>
    </radialGradient>

    <!-- ===== MEDALLION RIM ===== -->
    <radialGradient id="ow-rim" cx="32%" cy="22%" r="80%">
      <stop offset="0%"   stop-color="#fff3b0"/>
      <stop offset="25%"  stop-color="#f0c030"/>
      <stop offset="55%"  stop-color="#c08010"/>
      <stop offset="80%"  stop-color="#7a4800"/>
      <stop offset="100%" stop-color="#3d1c00"/>
    </radialGradient>

    <!-- ===== SKY / WASHI PAPER ===== -->
    <linearGradient id="ow-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#dbd5c5"/>
      <stop offset="45%"  stop-color="#cfc8b5"/>
      <stop offset="100%" stop-color="#bdb5a0"/>
    </linearGradient>

    <!-- ===== DEEP OCEAN WATER ===== -->
    <linearGradient id="ow-deep" x1="95%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#050f1e"/>
      <stop offset="35%"  stop-color="#0b2042"/>
      <stop offset="70%"  stop-color="#133568"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>

    <!-- ===== MID OCEAN / SWELL ===== -->
    <linearGradient id="ow-mid" x1="90%" y1="0%" x2="5%" y2="100%">
      <stop offset="0%"   stop-color="#0e2e60"/>
      <stop offset="40%"  stop-color="#1a50a0"/>
      <stop offset="80%"  stop-color="#2278d0"/>
      <stop offset="100%" stop-color="#44a0f0"/>
    </linearGradient>

    <!-- ===== WAVE BARREL INTERIOR ===== -->
    <radialGradient id="ow-barrel" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#04101e"/>
      <stop offset="55%"  stop-color="#081c38"/>
      <stop offset="100%" stop-color="#122e58"/>
    </radialGradient>

    <!-- ===== SEA FOAM ===== -->
    <linearGradient id="ow-foam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#eef6ff"/>
      <stop offset="85%"  stop-color="#d0eaff"/>
      <stop offset="100%" stop-color="#b0d8f8"/>
    </linearGradient>

    <!-- ===== FOREGROUND WAVE ===== -->
    <linearGradient id="ow-fg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0c2858"/>
      <stop offset="50%"  stop-color="#1c50a8"/>
      <stop offset="100%" stop-color="#3a80d0"/>
    </linearGradient>

    <!-- ===== CLIP PATH — circular disc (cx=47, cy=107, r=39) ===== -->
    <clipPath id="ow-clip">
      <circle cx="47" cy="107" r="39"/>
    </clipPath>

    <!-- ===== DROP SHADOW ===== -->
    <filter id="ow-shadow" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000010" flood-opacity="0.40"/>
    </filter>

    <!-- ===== RIM INNER GLOW ===== -->
    <filter id="ow-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

  </defs>

  <!-- =====================================================
       SECTION 1 — SUSPENSION CORD  (y 0–50)
       ===================================================== -->

  <!-- Main silk cord -->
  <line x1="47" y1="0" x2="47" y2="48"
        stroke="url(#ow-cord)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Highlight thread -->
  <line x1="46.2" y1="0" x2="46.2" y2="48"
        stroke="#c8a055" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>

  <!-- =====================================================
       BEAD 1 — Pearl (y ≈ 8–19)
       ===================================================== -->
  <!-- Gold cap top -->
  <path d="M43.5 8.5 Q47 10.5 50.5 8.5 L50 7.5 Q47 9.2 44 7.5 Z" fill="url(#ow-gold)"/>
  <!-- Pearl sphere -->
  <circle cx="47" cy="14" r="5.8" fill="url(#ow-pearl)"/>
  <!-- Specular highlight -->
  <ellipse cx="45" cy="12" rx="2.2" ry="1.3" fill="#ffffff" opacity="0.92"/>
  <circle cx="49" cy="15.5" r="0.7" fill="#c0d8f0" opacity="0.6"/>
  <!-- Gold cap bottom -->
  <path d="M43.5 19.5 Q47 17.5 50.5 19.5 L50 20.5 Q47 18.8 44 20.5 Z" fill="url(#ow-gold)"/>

  <!-- =====================================================
       BEAD 2 — Lapis Lazuli (y ≈ 24–37)
       ===================================================== -->
  <!-- Gold cap top -->
  <path d="M42.5 23 Q47 25 51.5 23 L51 22 Q47 23.8 43 22 Z" fill="url(#ow-gold)"/>
  <!-- Lapis sphere -->
  <circle cx="47" cy="30" r="7" fill="url(#ow-lapis)"/>
  <!-- Mineral vein highlight -->
  <ellipse cx="45" cy="27.5" rx="2.6" ry="1.5" fill="#a0c8ff" opacity="0.75"/>
  <!-- Gold fleck -->
  <circle cx="49.5" cy="31.5" r="1.0" fill="#f8e060" opacity="0.80"/>
  <circle cx="44.5" cy="33" r="0.7" fill="#f0d040" opacity="0.55"/>
  <!-- Gold cap bottom -->
  <path d="M42.5 37 Q47 35 51.5 37 L51 38 Q47 36.2 43 38 Z" fill="url(#ow-gold)"/>

  <!-- =====================================================
       ATTACHMENT KNOT RING (y ≈ 42–50)
       ===================================================== -->
  <circle cx="47" cy="46" r="4.8"
          fill="none" stroke="url(#ow-gold)" stroke-width="2.6"/>
  <circle cx="47" cy="46" r="2.2" fill="#2a1200"/>
  <!-- Cord threading through ring -->
  <line x1="47" y1="42" x2="47" y2="50"
        stroke="url(#ow-cord)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Ring over cord -->
  <circle cx="47" cy="46" r="4.8"
          fill="none" stroke="url(#ow-gold)" stroke-width="2.2" opacity="0.9"/>

  <!-- =====================================================
       SECTION 2 — CIRCULAR MEDALLION  (center 47, 107, r=40)
       ===================================================== -->
  <g filter="url(#ow-shadow)">

    <!-- Outer gold bezel frame -->
    <circle cx="47" cy="107" r="40.5" fill="url(#ow-rim)"/>
    <!-- Dark inner border line -->
    <circle cx="47" cy="107" r="39.3" fill="#1c0a00"/>

    <!-- ===== ALL WAVE ARTWORK clipped to disc ===== -->
    <g clip-path="url(#ow-clip)">

      <!-- 1. WASHI PAPER SKY BACKGROUND -->
      <rect x="8" y="68" width="78" height="78" fill="url(#ow-sky)"/>

      <!-- Subtle washi texture lines -->
      <line x1="8"  y1="85"  x2="86" y2="85"  stroke="#c8c0aa" stroke-width="0.35" opacity="0.45"/>
      <line x1="8"  y1="98"  x2="86" y2="98"  stroke="#c8c0aa" stroke-width="0.30" opacity="0.35"/>
      <line x1="8"  y1="112" x2="86" y2="112" stroke="#c8c0aa" stroke-width="0.30" opacity="0.35"/>

      <!-- 2. DEEP OCEAN BASE (bottom third) -->
      <rect x="8" y="128" width="78" height="18" fill="url(#ow-deep)"/>

      <!-- 3. MAIN GREAT WAVE BODY
           A towering wave rising from the right side, curling over to the left -->
      <path d="
        M 10 145
        C 10 132, 16 122, 25 116
        C 34 110, 44 108, 52 101
        C 60 94, 64 80, 61 70
        C 58 62, 52 58, 46 61
        C 40 64, 35 72, 29 79
        C 36 68, 47 57, 58 54
        C 70 51, 80 60, 84 76
        C 88 92, 87 112, 84 128
        C 81 140, 74 146, 64 146
        L 10 146 Z"
        fill="url(#ow-deep)"/>

      <!-- 4. MID-TONE SWELL LAYER (gives the wave its roll + depth) -->
      <path d="
        M 58 54
        C 70 58, 80 70, 84 86
        C 88 102, 87 120, 85 134
        C 82 144, 74 147, 64 147
        C 54 147, 44 141, 36 133
        C 48 126, 58 118, 66 107
        C 74 96, 78 82, 75 69
        C 73 61, 67 55, 58 54 Z"
        fill="url(#ow-mid)"/>

      <!-- 5. WAVE BARREL / HOLLOW (dark cavity inside the curl) -->
      <path d="
        M 79 84
        C 78 100, 68 118, 55 130
        C 43 139, 30 140, 18 135
        C 25 129, 34 123, 42 117
        C 51 110, 57 99, 55 87
        C 53 77, 47 72, 41 76
        C 48 67, 60 63, 68 68
        C 75 72, 80 77, 79 84 Z"
        fill="url(#ow-barrel)"/>

      <!-- 6. JAPANESE WATER STRIATIONS (contour flow lines) -->
      <path d="M 85 98  C 86 115, 81 130, 71 141 C 62 147, 50 147, 38 147"
            fill="none" stroke="#3090e0" stroke-width="1.4" stroke-linecap="round" opacity="0.80"/>
      <path d="M 82 87  C 83 104, 78 121, 68 133 C 59 142, 46 145, 34 145"
            fill="none" stroke="#5aa8f0" stroke-width="1.2" stroke-linecap="round" opacity="0.78"/>
      <path d="M 77 76  C 79 93, 74 111, 64 124 C 55 134, 42 138, 30 138"
            fill="none" stroke="#80c0ff" stroke-width="1.0" stroke-linecap="round" opacity="0.72"/>
      <path d="M 71 67  C 73 83, 68 100, 58 113 C 49 124, 37 129, 25 130"
            fill="none" stroke="#a8d8ff" stroke-width="0.9" stroke-linecap="round" opacity="0.65"/>
      <path d="M 63 58  C 66 72, 62 88, 52 101 C 44 111, 34 117, 23 120"
            fill="none" stroke="#c0e4ff" stroke-width="0.8" stroke-linecap="round" opacity="0.60"/>
      <!-- Foreground wave striations -->
      <path d="M 10 136 C 14 127, 21 120, 30 115 C 39 110, 48 108, 53 102"
            fill="none" stroke="#80c0ff" stroke-width="1.1" stroke-linecap="round" opacity="0.80"/>
      <path d="M 14 143 C 19 135, 27 128, 37 123 C 46 118, 54 115, 58 108"
            fill="none" stroke="#a8d8ff" stroke-width="1.0" stroke-linecap="round" opacity="0.70"/>

      <!-- 7. FOREGROUND WAVE (lower swell surging toward viewer) -->
      <path d="
        M 10 146
        C 10 133, 16 124, 24 118
        C 32 112, 41 111, 49 105
        C 55 100, 58 91, 55 83
        C 52 77, 47 76, 43 80
        C 38 85, 35 93, 30 101
        C 24 109, 16 113, 10 116
        L 10 146 Z"
        fill="url(#ow-fg)"/>

      <!-- 8. WHITE SEA FOAM MASS (the great cresting crest) -->
      <path d="
        M 52 52
        C 59 52, 68 56, 76 63
        C 82 70, 85 80, 84 92
        C 81 91, 78 88, 76 90
        C 74 92, 75 96, 72 98
        C 70 100, 67 97, 65 99
        C 63 101, 64 105, 62 107
        C 60 109, 57 105, 54 108
        C 51 111, 53 115, 50 118
        C 47 121, 44 117, 41 120
        C 38 123, 40 127, 37 130
        C 34 133, 29 130, 26 134
        C 23 137, 25 142, 21 145
        C 18 147, 12 144, 10 147
        C 9 141, 12 134, 17 130
        C 22 126, 28 123, 32 116
        C 36 109, 34 103, 39 97
        C 43 91, 50 88, 53 81
        C 56 74, 53 66, 49 61
        C 45 56, 40 55, 37 60
        C 41 53, 46 51, 52 52 Z"
        fill="url(#ow-foam)"/>

      <!-- 9. HOKUSAI FOAM CLAWS — five white claw fingers reaching down -->
      <!-- Claw 1 (leftmost, longest) -->
      <path d="M 48 61 C 51 67, 50 76, 46 81 C 43 85, 38 87, 35 92
               C 32 96, 33 101, 29 104 C 27 106, 24 103, 25 100
               C 27 95, 31 91, 35 86 C 39 81, 42 75, 41 69
               C 40 64, 44 61, 48 61 Z"
            fill="#ffffff"/>
      <!-- Claw 2 -->
      <path d="M 44 53 C 38 58, 32 65, 25 72 C 21 76, 17 81, 14 88
               C 13 90, 11 89, 11 87 C 12 80, 17 74, 22 67
               C 28 59, 36 51, 44 53 Z"
            fill="#ffffff"/>
      <!-- Claw 3 -->
      <path d="M 55 70 C 59 76, 58 84, 53 90 C 50 94, 45 96, 43 101
               C 41 104, 43 108, 40 110 C 38 111, 36 109, 37 106
               C 39 101, 43 97, 47 92 C 51 87, 52 79, 50 73
               C 49 69, 52 67, 55 70 Z"
            fill="#ffffff"/>
      <!-- Claw 4 -->
      <path d="M 63 83 C 66 88, 65 96, 61 101 C 58 105, 53 108, 51 113
               C 49 116, 51 120, 48 122 C 46 123, 44 121, 45 118
               C 47 113, 51 108, 54 104 C 58 99, 59 91, 57 85
               C 56 81, 60 79, 63 83 Z"
            fill="#ffffff"/>
      <!-- Claw 5 (right, short) -->
      <path d="M 71 94 C 73 99, 72 106, 68 111 C 65 115, 60 118, 58 123
               C 56 126, 58 130, 55 132 C 53 133, 51 131, 52 128
               C 54 123, 58 119, 61 115 C 65 110, 66 102, 64 97
               C 63 93, 68 91, 71 94 Z"
            fill="#ffffff"/>

      <!-- 10. CREST TOP CURL HOOKS (the tiny curled tips at very top of wave) -->
      <path d="M 54 51 C 51 47, 46 48, 43 51 C 41 53, 42 55, 45 54
               C 48 53, 52 52, 54 51 Z" fill="#ffffff"/>
      <path d="M 61 53 C 59 49, 54 49, 51 52 C 50 54, 52 55, 54 54
               C 57 53, 60 54, 61 53 Z" fill="#ffffff"/>
      <path d="M 69 57 C 67 53, 62 52, 59 55 C 58 57, 60 58, 62 57
               C 65 56, 68 58, 69 57 Z" fill="#ffffff"/>
      <path d="M 77 65 C 76 61, 71 60, 68 63 C 67 65, 69 66, 71 65
               C 74 64, 76 66, 77 65 Z" fill="#ffffff"/>

      <!-- 11. FOREGROUND WAVE FOAM FINGERS -->
      <path d="M 10 113 C 15 109, 21 106, 28 101 C 34 97, 40 93, 45 87
               C 47 85, 49 88, 47 90 C 42 97, 35 102, 28 106
               C 21 110, 14 114, 10 118 Z"
            fill="#ffffff"/>
      <path d="M 16 124 C 21 120, 27 116, 34 112 C 40 108, 46 104, 51 98
               C 52 96, 54 98, 53 100 C 48 106, 42 110, 35 114
               C 28 118, 21 122, 16 127 Z"
            fill="#ffffff"/>

      <!-- 12. SEA SPRAY DROPLETS scattered across washi sky -->
      <g fill="#ffffff">
        <!-- Upper scatter — fine mist -->
        <circle cx="40" cy="70" r="0.7" opacity="0.80"/>
        <circle cx="34" cy="75" r="1.0" opacity="0.85"/>
        <circle cx="28" cy="80" r="1.2" opacity="0.88"/>
        <circle cx="22" cy="86" r="1.0" opacity="0.85"/>
        <circle cx="17" cy="93" r="1.3" opacity="0.90"/>
        <circle cx="13" cy="101" r="1.0" opacity="0.85"/>
        <!-- Second arc -->
        <circle cx="37" cy="68" r="0.6" opacity="0.75"/>
        <circle cx="31" cy="72" r="0.8" opacity="0.80"/>
        <circle cx="25" cy="77" r="0.7" opacity="0.78"/>
        <circle cx="19" cy="83" r="0.9" opacity="0.82"/>
        <circle cx="14" cy="90" r="0.8" opacity="0.80"/>
        <!-- Crest scatter along top arc -->
        <circle cx="43" cy="68" r="0.8" opacity="0.82"/>
        <circle cx="48" cy="66" r="0.9" opacity="0.85"/>
        <circle cx="54" cy="66" r="0.7" opacity="0.78"/>
        <circle cx="60" cy="68" r="1.0" opacity="0.85"/>
        <circle cx="67" cy="71" r="0.9" opacity="0.82"/>
        <circle cx="74" cy="76" r="1.1" opacity="0.88"/>
        <circle cx="80" cy="82" r="0.9" opacity="0.80"/>
        <!-- Hollow spray -->
        <circle cx="36" cy="88" r="1.0" opacity="0.85"/>
        <circle cx="30" cy="94" r="0.8" opacity="0.80"/>
        <circle cx="26" cy="100" r="1.1" opacity="0.88"/>
        <circle cx="42" cy="96" r="0.9" opacity="0.82"/>
        <circle cx="47" cy="91" r="0.7" opacity="0.78"/>
        <circle cx="52" cy="98" r="1.0" opacity="0.85"/>
        <circle cx="58" cy="95" r="0.8" opacity="0.80"/>
        <!-- Fine sky mist -->
        <circle cx="23" cy="72" r="0.5" opacity="0.70"/>
        <circle cx="17" cy="78" r="0.5" opacity="0.70"/>
        <circle cx="28" cy="68" r="0.5" opacity="0.68"/>
        <circle cx="35" cy="64" r="0.6" opacity="0.72"/>
        <circle cx="43" cy="63" r="0.5" opacity="0.68"/>
        <circle cx="51" cy="63" r="0.6" opacity="0.70"/>
        <circle cx="58" cy="64" r="0.5" opacity="0.68"/>
        <circle cx="66" cy="67" r="0.6" opacity="0.72"/>
        <circle cx="73" cy="72" r="0.5" opacity="0.70"/>
      </g>

    </g>
    <!-- end clip group -->

    <!-- 13. MEDALLION INNER GOLD BEZEL RING (drawn on top, outside clip) -->
    <circle cx="47" cy="107" r="39"
            fill="none" stroke="url(#ow-gold)" stroke-width="1.8" opacity="0.96"/>
    <!-- Inner soft white specular arc -->
    <path d="M 26 72 A 38 38 0 0 1 68 72"
          fill="none" stroke="#ffffff" stroke-width="1.0" opacity="0.30"/>

  </g>
  <!-- end medallion filter group -->

</svg>
