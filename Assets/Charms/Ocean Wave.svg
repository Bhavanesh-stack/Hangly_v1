    <path d="M 63 51 C 61 47, 56 46, 53 49 C 52 51, 54 52, 56 51 C 59 50, 62 52, 63 51 Z" fill="#ffffff"/>
    <path d="M 72 59 C 71 55, 66 54, 63 57 C 62 59, 64 60, 66 59 C 69 58, 71 60, 72 59 Z" fill="#ffffff"/>
    <path d="M 79 70 C 79 66, 75 64, 72 67 C 71 69, 73 70, 75 69 C 77 68, 79 71, 79 70 Z" fill="#ffffff"/>

    <!-- 7. FOREGROUND FOAM CRESTS & FROTH (On lower surging wave) -->
    <path d="M 6 107 C 11 103, 17 100, 24 96 C 30 92, 36 88, 41 82 C 43 80, 45 83, 43 85 C 38 91, 31 96, 25 100 C 18 104, 11 108, 6 112 Z"
          fill="#ffffff"/>
    <path d="M 12 118 C 17 114, 23 110, 30 106 C 36 102, 42 98, 47 92 C 48 90, 50 92, 49 94 C 44 100, 38 104, 31 108 C 24 112, 17 116, 12 121 Z"
          fill="#ffffff"/>
    <path d="M 16 128 C 22 124, 29 120, 36 115 C 42 110, 48 105, 53 99 C 54 97, 56 99, 55 101 C 49 107, 43 112, 36 117 C 29 121, 22 126, 16 131 Z"
          fill="#ffffff"/>

    <!-- Churning Sea Foam Swirls at Base -->
    <ellipse cx="28" cy="148" rx="8" ry="4.5" fill="#f0f9ff" opacity="0.9"/>
    <circle cx="27" cy="148" r="3.2" fill="#18417c"/>
    <ellipse cx="46" cy="153" rx="10" ry="4.0" fill="#f0f9ff" opacity="0.85"/>
    <circle cx="45" cy="153" r="2.8" fill="#102a54"/>
    <ellipse cx="64" cy="150" rx="9" ry="4.2" fill="#f0f9ff" opacity="0.9"/>
    <circle cx="63" cy="150" r="3.0" fill="#0b1b36"/>

